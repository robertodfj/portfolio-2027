<section id="experience" class="experience">
  <p class="eyebrow" data-reveal>experiencia.log</p>
  <h2 class="section-title" data-reveal>En qué he estado trabajando</h2>

  <ol class="timeline">
    <li class="timeline__entry" data-reveal *ngFor="let item of items">
      <span class="timeline__node" aria-hidden="true"></span>

      <span class="timeline__period">{{ item.period }}</span>

      <h3 class="timeline__role">
        {{ item.role }} <span class="timeline__company">· {{ item.company }}</span>
      </h3>

      <ul class="timeline__bullets">
        <li *ngFor="let b of item.bullets">{{ b }}</li>
      </ul>

      <ul class="timeline__stack">
        <li *ngFor="let s of item.stack">{{ s }}</li>
      </ul>
    </li>
  </ol>
</section>
