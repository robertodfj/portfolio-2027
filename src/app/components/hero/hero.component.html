<section id="top" class="hero">

  <div class="hero__content">

    <p class="eyebrow" data-reveal>
      {{ 'hero.eyebrow' | translate }}
    </p>

    <div class="hero__availability" data-reveal>
      <span class="hero__availability-dot"></span>
      {{ 'hero.available' | translate }}
    </div>

    <h1 class="hero__name" data-reveal>
      <span class="hero__name-accent">ROBERTO</span><br />
      <span class="hero__name-accent">D</span>E
      <span class="hero__name-accent">F</span>RUTOS
      <span class="hero__name-accent">J</span>IMÉNEZ
    </h1>

    <h2 class="hero__role" data-reveal>
      {{ 'hero.role' | translate }}
    </h2>

    <p class="hero__tagline" data-reveal>
      {{ 'hero.tagline' | translate }}
    </p>

    <app-language-picker class="hero__lang" data-reveal />

  </div>

  <div
    class="hero__scroll-cue"
    data-reveal
    aria-hidden="true"
  >
    <span>{{ 'hero.scroll' | translate }}</span>

    <div class="hero__scroll-line">
      <i></i>
    </div>
  </div>

</section>
