<header class="nav">
  <div class="nav__progress" [style.width.%]="progress()"></div>

  <a class="nav__brand" href="#top" (click)="goTo('top')">
    <span class="nav__cursor" aria-hidden="true"></span>
    robertodfj<span class="nav__dim">.com</span>
  </a>

  <nav class="nav__links" [class.nav__links--open]="menuOpen()" [attr.aria-label]="'nav.aria' | translate">
    <button class="nav__link" type="button" *ngFor="let link of links" (click)="goTo(link.id)">
      {{ 'nav.' + link.id | translate }}
    </button>
    <a class="btn nav__cta" href="#contact" (click)="goTo('contact')">{{ 'nav.cta' | translate }}</a>
  </nav>

  <div class="nav__tools">
    <app-theme-toggle />

    <button
      class="nav__toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="'nav.openMenu' | translate"
    >
      <span></span><span></span>
    </button>
  </div>
</header>
