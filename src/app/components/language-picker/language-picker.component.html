<div class="lang">
  <span class="lang__label">{{ 'hero.languageLabel' | translate }}</span>

  <div class="lang__options">
    <button
      type="button"
      class="lang__flag"
      [class.lang__flag--active]="lang.current() === 'es'"
      [attr.aria-pressed]="lang.current() === 'es'"
      [attr.aria-label]="'a11y.langEs' | translate"
      (click)="lang.use('es')"
    >
      <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <defs>
          <clipPath id="flagRoundEs"><circle cx="16" cy="16" r="16" /></clipPath>
        </defs>
        <g clip-path="url(#flagRoundEs)">
          <rect width="32" height="32" fill="#c60b1e" />
          <rect y="8" width="32" height="16" fill="#ffc400" />
        </g>
      </svg>
    </button>

    <button
      type="button"
      class="lang__flag"
      [class.lang__flag--active]="lang.current() === 'en'"
      [attr.aria-pressed]="lang.current() === 'en'"
      [attr.aria-label]="'a11y.langEn' | translate"
      (click)="lang.use('en')"
    >
      <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <defs>
          <clipPath id="flagRoundEn"><circle cx="16" cy="16" r="16" /></clipPath>
        </defs>
        <g clip-path="url(#flagRoundEn)">
          <rect width="32" height="32" fill="#012169" />
          <path d="M0 0 L32 32 M32 0 L0 32" stroke="#ffffff" stroke-width="7" />
          <path d="M0 0 L32 32 M32 0 L0 32" stroke="#c8102e" stroke-width="3" />
          <path d="M16 0 V32 M0 16 H32" stroke="#ffffff" stroke-width="10" />
          <path d="M16 0 V32 M0 16 H32" stroke="#c8102e" stroke-width="6" />
        </g>
      </svg>
    </button>
  </div>
</div>
