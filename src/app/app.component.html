<canvas #sceneCanvas class="scene-canvas" aria-hidden="true"></canvas>

<app-loading-screen *ngIf="loading()" [leaving]="loaderLeaving()"></app-loading-screen>

<app-navbar />

<main id="main-content">
  <app-hero />
  <app-about />
  <app-experience />
  <app-technologies />
  <app-projects />
  <app-contact />
</main>

<button
  class="scroll-top"
  type="button"
  [attr.aria-label]="'a11y.scrollTop' | translate"
  [class.scroll-top--visible]="showScrollTop()"
  (click)="scrollToTop()"
>
  ↑
</button>

<p class="scene-fallback" *ngIf="sceneUnavailable()" role="status">
  {{ 'a11y.noWebgl' | translate }}
</p>

<span class="visually-hidden" *ngIf="usingPlaceholder()">
  {{ 'a11y.placeholderModel' | translate }}
</span>
