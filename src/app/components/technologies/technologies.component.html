<section id="technologies" class="tech">
  <p class="eyebrow" data-reveal>stack.json</p>
  <h2 class="section-title" data-reveal>Con qué trabajo</h2>

  <div class="tech__grid" data-reveal>
    <button
      type="button"
      class="tech__item"
      *ngFor="let t of technologies"
      (mouseenter)="setHovered(t.name)"
      (mouseleave)="setHovered(null)"
      (focus)="setHovered(t.name)"
      (blur)="setHovered(null)"
      [class.tech__item--active]="hovered() === t.name"
    >
      <span class="tech__name">{{ t.name }}</span>
      <span class="tech__note">{{ t.note }}</span>
    </button>
  </div>
</section>
